<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories Editor</title>
  <link rel="stylesheet" href="/editor.css">
  <script type="module" src="/editor.js"></script>
</head>
<body>
  <header>
    <h1>Categories Editor</h1>
    <p class="hint">Edits <code>src/default-categories.js</code>, the starting list for a fresh install. Drag rows by the handle, or focus a handle and use the arrow keys. Nothing changes on disk until you press Save.</p>
    <div class="bar">
      <button type="button" id="save" class="primary">Save</button>
      <button type="button" id="revert">Revert</button>
      <span id="status" role="status"></span>
    </div>
    <ul id="problems" class="problems" aria-label="Problems"></ul>
  </header>
  <main>
    <div class="row head" aria-hidden="true">
      <span>Key</span><span></span><span>Name</span><span>Kind</span><span>Type</span><span>id</span><span></span>
    </div>
    <ol id="list" class="list" aria-label="Default categories"></ol>
    <form id="add" class="bar add">
      <label for="add-name">New category</label>
      <input id="add-name" autocomplete="off" placeholder="Name">
      <button type="submit">Add</button>
    </form>
  </main>
</body>
</html>
